<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metrobús CDMX — Mapa en tiempo real</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
    --text:#e8eaed; --muted:#9aa0ac; --accent:#ff5a1f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
  #app{display:flex;height:100vh;width:100vw;}
  #sidebar{width:360px;min-width:300px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
  #map{flex:1;}
  header{padding:14px 16px 10px;border-bottom:1px solid var(--border);}
  header h1{font-size:16px;margin:0 0 2px;font-weight:700;letter-spacing:.2px;}
  header p{margin:0;font-size:12px;color:var(--muted);}
  .section{padding:12px 16px;border-bottom:1px solid var(--border);}
  .section h2{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 8px;}
  input[type="text"]{
    width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);font-size:13px;outline:none;
  }
  input[type="text"]:focus{border-color:var(--accent);}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .chip{
    padding:5px 10px;border-radius:999px;border:1px solid var(--border);background:var(--panel2);
    font-size:12px;cursor:pointer;color:var(--text);user-select:none;transition:.15s;
  }
  .chip.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  select{
    width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);font-size:13px;outline:none;
  }
  #vehicleList{flex:1;overflow-y:auto;padding:6px 10px 16px;}
  .veh-item{
    padding:10px 10px;border-radius:8px;margin-bottom:6px;background:var(--panel2);
    border:1px solid var(--border);cursor:pointer;transition:.15s;
  }
  .veh-item:hover{border-color:var(--accent);}
  .veh-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .veh-eco{font-weight:700;font-size:14px;}
  .veh-line{
    font-size:11px;font-weight:700;color:#fff;padding:2px 8px;border-radius:6px;white-space:nowrap;
  }
  .veh-route{font-size:12px;color:var(--muted);margin-top:3px;}
  .veh-meta{font-size:11px;color:var(--muted);margin-top:4px;display:flex;gap:10px;}
  #count{font-size:12px;color:var(--muted);padding:8px 16px 0;}
  .empty{padding:20px 16px;color:var(--muted);font-size:13px;text-align:center;}
  .leaflet-popup-content-wrapper{background:var(--panel2);color:var(--text);border-radius:10px;}
  .leaflet-popup-tip{background:var(--panel2);}
  .popup-eco{font-weight:700;font-size:14px;margin-bottom:4px;}
  .popup-row{font-size:12px;color:var(--muted);margin-top:2px;}
  .clear-btn{background:none;border:none;color:var(--accent);font-size:11px;cursor:pointer;padding:0;margin-left:8px;}
  #statusBar{padding:6px 16px;font-size:11px;color:var(--muted);background:var(--panel2);border-top:1px solid var(--border);}
  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <header>
      <h1>🚌 Metrobús CDMX</h1>
      <p>Mapa de líneas y unidades en servicio</p>
    </header>

    <div class="section">
      <h2>Buscar unidad (número económico)</h2>
      <input type="text" id="searchBox" placeholder="Ej. 2306" />
    </div>

    <div class="section">
      <h2>Línea <button class="clear-btn" onclick="clearFilter('line')">limpiar</button></h2>
      <div class="chips" id="lineChips"></div>
    </div>

    <div class="section">
      <h2>Destino</h2>
      <select id="destinoSelect"><option value="">Todos</option></select>
    </div>

    <div class="section">
      <h2>Ruta / variante</h2>
      <select id="routeSelect"><option value="">Todas</option></select>
    </div>

    <div class="section">
      <h2>Empresa / concesionario</h2>
      <select id="empresaSelect"><option value="">Todas</option></select>
    </div>

    <div id="count">Cargando…</div>
    <div id="vehicleList"></div>
    <div id="statusBar">Cargando datos…</div>
  </div>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
<script>
const LINE_COLORS = {
  '1':'#D40D0D','2':'#F29F05','3':'#7A9A01','4':'#8C1AA6',
  '5':'#8A5A2E','6':'#E44599','7':'#0090C1'
};

let routesData = [], stopsData = [], vehiclesData = [], empresaMap = {};
let map, stopsLayer, routesLayer, vehicleMarkers = {};
let selectedLine = null, selectedEco = null;

const routeById = {};

async function loadData(){
  const [routesRes, stopsRes, vehiclesRes] = await Promise.all([
    fetch('data/routes.json'), fetch('data/stops.json'), fetch('data/vehicles.json')
  ]);
  routesData = await routesRes.json();
  stopsData = await stopsRes.json();
  vehiclesData = await vehiclesRes.json();
  routesData.forEach(r => routeById[r.route_id] = r);

  // Optional empresas CSV — silently ignored if missing
  try {
    const empRes = await fetch('data/empresas.csv');
    if (empRes.ok) {
      const text = await empRes.text();
      const parsed = Papa.parse(text, {header:true, skipEmptyLines:true});
      parsed.data.forEach(row => {
        if(row.numero_economico) empresaMap[row.numero_economico.trim()] = row.empresa.trim();
      });
    }
  } catch(e) { /* no empresas file yet */ }

  vehiclesData.forEach(v => v.empresa = empresaMap[v.label] || 'Sin asignar');

  initMap();
  drawRoutes();
  drawStops();
  buildLineChips();
  buildSelects();
  drawVehicles();
  renderList();

  startLivePolling();
}

// ---- Polling de tiempo real ----
// Vuelve a pedir data/vehicles.json cada POLL_MS y redibuja los iconos.
// Si estás corriendo update_realtime.py en paralelo, ese archivo se va
// sobrescribiendo con posiciones frescas y aquí simplemente lo recargamos.
const POLL_MS = 25000;

function startLivePolling(){
  setInterval(refreshVehicles, POLL_MS);
}

async function refreshVehicles(){
  try {
    const res = await fetch('data/vehicles.json', {cache: 'no-store'});
    if (!res.ok) return;
    const fresh = await res.json();
    vehiclesData = fresh;
    vehiclesData.forEach(v => v.empresa = empresaMap[v.label] || 'Sin asignar');
    drawVehicles();
    renderList();
    document.getElementById('statusBar').textContent =
      'Última actualización: ' + new Date().toLocaleTimeString();
  } catch(e) {
    document.getElementById('statusBar').textContent = 'Error al actualizar: ' + e.message;
  }
}

function initMap(){
  map = L.map('map', {zoomControl:true}).setView([19.4326,-99.1332], 12);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution:'&copy; OpenStreetMap &copy; CARTO',
    subdomains:'abcd', maxZoom:19
  }).addTo(map);
  routesLayer = L.layerGroup().addTo(map);
  stopsLayer = L.layerGroup().addTo(map);
}

function drawRoutes(){
  routesLayer.clearLayers();
  const seen = new Set();
  routesData.forEach(r => {
    if (!r.shape || !r.shape.length) return;
    // avoid drawing duplicate overlapping shapes for same line pair
    const key = r.line + '_' + r.route_id;
    if (seen.has(key)) return;
    seen.add(key);
    const color = LINE_COLORS[r.line] || r.color || '#888';
    L.polyline(r.shape, {color, weight:3, opacity:0.55}).addTo(routesLayer);
  });
}

function drawStops(){
  stopsLayer.clearLayers();
  stopsData.forEach(s => {
    L.circleMarker([s.lat, s.lon], {
      radius:3, color:'#ffffff', fillColor:'#ffffff', fillOpacity:0.8, weight:1, opacity:0.6
    }).bindTooltip(s.name, {direction:'top'}).addTo(stopsLayer);
  });
}

function busIcon(color){
  return L.divIcon({
    className:'', html:`<div style="
      background:${color};width:16px;height:16px;border-radius:50%;
      border:2px solid #fff;box-shadow:0 0 4px rgba(0,0,0,.6);
      display:flex;align-items:center;justify-content:center;"></div>`,
    iconSize:[16,16], iconAnchor:[8,8]
  });
}

function drawVehicles(){
  Object.values(vehicleMarkers).forEach(m => map.removeLayer(m));
  vehicleMarkers = {};
  filteredVehicles().forEach(v => {
    const color = LINE_COLORS[v.line] || '#bbb';
    const marker = L.marker([v.lat, v.lon], {icon: busIcon(color)});
    marker.bindPopup(`
      <div class="popup-eco">Eco. ${v.label}</div>
      <div class="popup-row">Línea ${v.line || '—'} · Ruta ${v.route_id}</div>
      <div class="popup-row">${v.origen || '—'} → ${v.destino || '—'}</div>
      <div class="popup-row">Empresa: ${v.empresa}</div>
      <div class="popup-row">Placa: ${v.plate || '—'}</div>
    `);
    marker.addTo(map);
    vehicleMarkers[v.id] = marker;
  });
}

function buildLineChips(){
  const container = document.getElementById('lineChips');
  const lines = [...new Set(routesData.map(r=>r.line))].sort();
  container.innerHTML = '';
  lines.forEach(line => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.textContent = 'Línea ' + line;
    chip.style.borderColor = LINE_COLORS[line];
    chip.onclick = () => {
      selectedLine = selectedLine === line ? null : line;
      document.querySelectorAll('#lineChips .chip').forEach(c=>c.classList.remove('active'));
      if (selectedLine) chip.classList.add('active');
      buildSelects();
      drawVehicles(); renderList();
    };
    container.appendChild(chip);
  });
}

function clearFilter(type){
  if(type==='line'){
    selectedLine = null;
    document.querySelectorAll('#lineChips .chip').forEach(c=>c.classList.remove('active'));
  }
  buildSelects();
  drawVehicles(); renderList();
}

function buildSelects(){
  const destinoSel = document.getElementById('destinoSelect');
  const routeSel = document.getElementById('routeSelect');
  const empresaSel = document.getElementById('empresaSelect');

  const relevantRoutes = routesData.filter(r => !selectedLine || r.line === selectedLine);
  const destinos = [...new Set(relevantRoutes.map(r=>r.destino).filter(Boolean))].sort();
  const prevDestino = destinoSel.value;
  destinoSel.innerHTML = '<option value="">Todos</option>' + destinos.map(d=>`<option value="${d}">${d}</option>`).join('');
  if (destinos.includes(prevDestino)) destinoSel.value = prevDestino;

  const prevRoute = routeSel.value;
  routeSel.innerHTML = '<option value="">Todas</option>' + relevantRoutes.map(r=>
    `<option value="${r.route_id}">L${r.line}: ${r.origen} → ${r.destino}</option>`).join('');
  if (relevantRoutes.some(r=>r.route_id===prevRoute)) routeSel.value = prevRoute;

  const empresas = [...new Set(Object.values(empresaMap))].sort();
  const prevEmp = empresaSel.value;
  empresaSel.innerHTML = '<option value="">Todas</option>' + empresas.map(e=>`<option value="${e}">${e}</option>`).join('') +
    (empresas.length ? '<option value="Sin asignar">Sin asignar</option>' : '');
  if ([...empresas,'Sin asignar'].includes(prevEmp)) empresaSel.value = prevEmp;
}

function filteredVehicles(){
  const destino = document.getElementById('destinoSelect').value;
  const routeId = document.getElementById('routeSelect').value;
  const empresa = document.getElementById('empresaSelect').value;
  const search = document.getElementById('searchBox').value.trim();

  return vehiclesData.filter(v => {
    if (selectedLine && v.line !== selectedLine) return false;
    if (destino && v.destino !== destino) return false;
    if (routeId && v.route_id !== routeId) return false;
    if (empresa && v.empresa !== empresa) return false;
    if (search && !v.label.includes(search)) return false;
    return true;
  });
}

function renderList(){
  const list = document.getElementById('vehicleList');
  const vehicles = filteredVehicles();
  document.getElementById('count').textContent = `${vehicles.length} unidades en servicio`;

  if (!vehicles.length){
    list.innerHTML = '<div class="empty">No hay unidades que coincidan con los filtros.</div>';
    return;
  }

  vehicles.sort((a,b)=> (a.line||'').localeCompare(b.line||'') || a.label.localeCompare(b.label));

  list.innerHTML = vehicles.map(v => `
    <div class="veh-item" onclick="focusVehicle('${v.id}')">
      <div class="veh-top">
        <span class="veh-eco">Eco. ${v.label}</span>
        <span class="veh-line" style="background:${LINE_COLORS[v.line]||'#666'}">L${v.line||'-'}</span>
      </div>
      <div class="veh-route">${v.origen||'—'} → ${v.destino||'—'}</div>
      <div class="veh-meta">
        <span>${v.empresa}</span>
        <span>Placa ${v.plate||'—'}</span>
      </div>
    </div>
  `).join('');
}

function focusVehicle(id){
  const marker = vehicleMarkers[id];
  if (!marker) return;
  map.flyTo(marker.getLatLng(), 15, {duration:0.6});
  marker.openPopup();
}

document.getElementById('searchBox').addEventListener('input', ()=>{drawVehicles();renderList();});
document.getElementById('destinoSelect').addEventListener('change', ()=>{drawVehicles();renderList();});
document.getElementById('routeSelect').addEventListener('change', ()=>{drawVehicles();renderList();});
document.getElementById('empresaSelect').addEventListener('change', ()=>{drawVehicles();renderList();});

loadData();
</script>
</body>
</html>
