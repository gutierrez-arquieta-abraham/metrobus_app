<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metrobús CDMX — Mapa en tiempo real</title>
<link rel="icon" type="image/webp" href="icons/app/ic_launcher.webp">
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
    --text:#e8eaed; --muted:#9aa0ac; --accent:#ff5a1f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);}
  #app{display:flex;height:100vh;width:100vw;}
  #sidebar{width:360px;min-width:300px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
  #map{flex:1;}
  header{padding:14px 16px 10px;border-bottom:1px solid var(--border);}
  header h1{font-size:16px;margin:0 0 2px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:8px;}
  .app-logo{width:22px;height:22px;border-radius:5px;flex-shrink:0;}
  .line-icon{width:18px;height:18px;object-fit:contain;flex-shrink:0;vertical-align:middle;}
  header p{margin:0;font-size:12px;color:var(--muted);}
  .section{padding:12px 16px;border-bottom:1px solid var(--border);}
  .section h2{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 8px;}
  input[type="text"]{
    width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);font-size:13px;outline:none;
  }
  input[type="text"]:focus{border-color:var(--accent);}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .chip{
    padding:5px 10px;border-radius:999px;border:1px solid var(--border);background:var(--panel2);
    font-size:12px;cursor:pointer;color:var(--text);user-select:none;transition:.15s;
    display:inline-flex;align-items:center;gap:5px;
  }
  .chip.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
  select{
    width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--border);
    background:var(--panel2);color:var(--text);font-size:13px;outline:none;
  }
  #vehicleList{flex:1;overflow-y:auto;padding:6px 10px 16px;}
  .veh-item{
    padding:10px 10px;border-radius:8px;margin-bottom:6px;background:var(--panel2);
    border:1px solid var(--border);cursor:pointer;transition:.15s;
  }
  .veh-item:hover{border-color:var(--accent);}
  .veh-top{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .veh-eco{font-weight:700;font-size:14px;}
  .veh-line{
    font-size:11px;font-weight:700;color:#fff;padding:2px 8px;border-radius:6px;white-space:nowrap;
    display:inline-flex;align-items:center;gap:4px;
  }
  .veh-line .line-icon{width:14px;height:14px;}
  .veh-route{font-size:12px;color:var(--muted);margin-top:3px;}
  .veh-meta{font-size:11px;color:var(--muted);margin-top:4px;display:flex;gap:10px;}
  #count{font-size:12px;color:var(--muted);padding:8px 16px 0;}
  .empty{padding:20px 16px;color:var(--muted);font-size:13px;text-align:center;}
  .popup-eco{font-weight:700;font-size:14px;margin-bottom:4px;}
  .popup-row{font-size:12px;color:var(--muted);margin-top:2px;}
  .clear-btn{background:none;border:none;color:var(--accent);font-size:11px;cursor:pointer;padding:0;margin-left:8px;}
  #statusBar{padding:6px 16px;font-size:11px;color:var(--muted);background:var(--panel2);border-top:1px solid var(--border);}
  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

  /* Chips de sistema (Metrobús/Mexibús/Mexicable): igual que .chip, pero de ancho completo
     en una fila (son pocos, 3 como máximo) para que se lean bien en pantalla angosta. */
  .sys-row{display:flex;gap:6px;}
  .sys-row .chip{flex:1;text-align:center;}

  /* Botón flotante de afectaciones + su panel. z-index por encima de los controles propios del
     mapa (zoom +/-, etc.) para que no quede tapado. */
  #afectBtn{
    position:absolute; top:12px; right:12px; z-index:1100; background:var(--panel);
    color:var(--text); border:1px solid var(--border); border-radius:999px; padding:8px 14px;
    font-size:12px; font-weight:600; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.4);
  }
  #afectBtn.alerta{border-color:var(--accent); color:var(--accent);}
  #afectPanel{
    position:absolute; top:52px; right:12px; z-index:1100; width:300px; max-height:70vh;
    overflow-y:auto; background:var(--panel); border:1px solid var(--border); border-radius:10px;
    box-shadow:0 4px 16px rgba(0,0,0,.5); display:none; padding:10px;
  }
  #afectPanel.open{display:block;}
  #afectPanel h3{margin:0 0 8px;font-size:13px;}
  .afect-card{
    background:var(--panel2); border:1px solid var(--border); border-radius:8px; padding:8px 10px;
    margin-bottom:8px; font-size:12px;
  }
  .afect-card .afect-linea{font-weight:700; margin-bottom:3px;}
  .afect-card .afect-estado{color:var(--accent); font-weight:600;}
  .afect-card .afect-info{color:var(--muted); margin-top:3px;}

  /* Botón de menú (solo visible en angosto) para mostrar/ocultar el sidebar como overlay. */
  #menuBtn{display:none;}

  /* Angosto (teléfono: Safari de iOS incluido) -- el sidebar de 360px fijo no entra en pantalla.
     Se vuelve un panel que se superpone al mapa, oculto por defecto. */
  @media (max-width:768px){
    #app{flex-direction:column;}
    #sidebar{
      position:absolute; inset:0; width:100%; min-width:0; z-index:1200;
      transform:translateX(-100%); transition:transform .2s ease; max-width:100%;
    }
    #sidebar.open{transform:translateX(0);}
    #map{width:100%; height:100%;}
    #menuBtn{
      display:block; position:absolute; top:12px; left:12px; z-index:1100; background:var(--panel);
      color:var(--text); border:1px solid var(--border); border-radius:999px; padding:8px 12px;
      font-size:16px; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.4);
    }
    #afectPanel{width:min(300px, calc(100vw - 24px));}
  }

  /* InfoWindow de Google Maps (popup de unidad): tema oscuro, igual que el resto de la UI. */
  .gm-style .gm-style-iw-c, .gm-style .gm-style-iw-d{background:var(--panel2) !important;}
  .gm-style .gm-style-iw-t::after{background:var(--panel2) !important;}
  .gm-style .gm-style-iw-d{color:var(--text);}
  .gm-ui-hover-effect > span{background-color:var(--text) !important;}
</style>
</head>
<body>
<button id="menuBtn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
<button id="afectBtn" onclick="toggleAfectPanel()">⚠ Afectaciones</button>
<div id="afectPanel"></div>
<div id="app">
  <div id="sidebar">
    <header>
      <h1><img src="icons/app/ic_launcher.webp" alt="" class="app-logo"> GeoMB — Mapa CDMX/Edomex</h1>
      <p>Metrobús, Mexibús y Mexicable en un mismo mapa</p>
    </header>

    <div class="section">
      <h2>Sistema en el mapa</h2>
      <div class="sys-row">
        <div class="chip active" id="chipMetrobus" onclick="toggleSistema('metrobus')">Metrobús</div>
        <div class="chip active" id="chipMexibus" onclick="toggleSistema('mexibus')">Mexibús</div>
        <div class="chip active" id="chipMexicable" onclick="toggleSistema('mexicable')">Mexicable</div>
      </div>
    </div>

    <div class="section">
      <h2>Buscar unidad (número económico)</h2>
      <input type="text" id="searchBox" placeholder="Ej. 2306" />
    </div>

    <div class="section">
      <h2>Línea <button class="clear-btn" onclick="clearFilter('line')">limpiar</button></h2>
      <div class="chips" id="lineChips"></div>
    </div>

    <div class="section">
      <h2>Destino</h2>
      <select id="destinoSelect"><option value="">Todos</option></select>
    </div>

    <div class="section">
      <h2>Ruta / variante</h2>
      <select id="routeSelect"><option value="">Todas</option></select>
    </div>

    <div class="section">
      <h2>Empresa / concesionario</h2>
      <select id="empresaSelect"><option value="">Todas</option></select>
    </div>

    <div id="count">Cargando…</div>
    <div id="vehicleList"></div>
    <div id="statusBar">Cargando datos…</div>
  </div>
  <div id="map"></div>
</div>

<script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
<script>
// Estilo oscuro del mapa (equivalente al tile dark_all que se usaba con Leaflet/CARTO).
const DARK_MAP_STYLE = [
  {elementType:'geometry', stylers:[{color:'#17191f'}]},
  {elementType:'labels.text.stroke', stylers:[{color:'#17191f'}]},
  {elementType:'labels.text.fill', stylers:[{color:'#8a90a0'}]},
  {featureType:'administrative', elementType:'geometry', stylers:[{color:'#2a2f3a'}]},
  {featureType:'poi', stylers:[{visibility:'off'}]},
  {featureType:'road', elementType:'geometry', stylers:[{color:'#2a2f3a'}]},
  {featureType:'road', elementType:'labels.text.fill', stylers:[{color:'#6b7280'}]},
  {featureType:'road.highway', elementType:'geometry', stylers:[{color:'#38414e'}]},
  {featureType:'transit', stylers:[{visibility:'off'}]},
  {featureType:'water', elementType:'geometry', stylers:[{color:'#0f1115'}]},
  {featureType:'water', elementType:'labels.text.fill', stylers:[{color:'#515c6d'}]},
];

const LINE_COLORS = {
  '1':'#D40D0D','2':'#F29F05','3':'#7A9A01','4':'#8C1AA6',
  '5':'#8A5A2E','6':'#E44599','7':'#0090C1'
};

let routesData = [], stopsData = [], vehiclesData = [], empresaMap = {};
let mexibusLineas = [];   // Mexibús (101-104/111-113) + Mexicable (201-202), ver data/mexibus_mapa.json
let metrobusLineas = [];  // Metrobús 1-7 CON pictograma real, ver data/metrobus_estaciones.json
let map, stopsLayer, routesLayer, vehicleMarkers = {}, vehicleInfoWindow;
let mexibusRoutesLayer, mexibusStopsLayer, mexicableRoutesLayer, mexicableStopsLayer;
// Debajo de este zoom, las ~300 estaciones de Metrobús (7 líneas que se cruzan todas por el
// centro) se amontonan tanto en pantalla que el pictograma dibujado AL ÚLTIMO (la última línea
// del bucle) tapa visualmente a los demás donde se encimen -- parecía que solo existiera esa
// línea. En vez de perseguir el z-index (no arregla el amontonamiento, solo cambia quién gana),
// los pictogramas de estación de los 3 sistemas se ocultan hasta que haya espacio real en
// pantalla para distinguirlos; las rutas trazadas (líneas de color) se ven siempre, a cualquier
// zoom -- igual que un mapa de transporte real.
const ZOOM_PICTOGRAMAS_MIN = 14;
let selectedLine = null, selectedEco = null;
const sistemasActivos = {metrobus:true, mexibus:true, mexicable:true};

const routeById = {};

async function loadData(){
  const [routesRes, stopsRes, vehiclesRes, mexibusRes, metrobusEstRes] = await Promise.all([
    fetch('data/routes.json'), fetch('data/stops.json'), fetch('data/vehicles.json'),
    fetch('data/mexibus_mapa.json').catch(()=>null),
    fetch('data/metrobus_estaciones.json').catch(()=>null),
  ]);
  routesData = await routesRes.json();
  stopsData = await stopsRes.json();
  vehiclesData = await vehiclesRes.json();
  routesData.forEach(r => routeById[r.route_id] = r);
  try { mexibusLineas = mexibusRes && mexibusRes.ok ? (await mexibusRes.json()).lineas : []; }
  catch(e) { mexibusLineas = []; }   // sin este archivo, el mapa sigue funcionando solo con Metrobús
  try { metrobusLineas = metrobusEstRes && metrobusEstRes.ok ? (await metrobusEstRes.json()).lineas : []; }
  catch(e) { metrobusLineas = []; }  // sin este archivo, drawStops() cae a los puntos blancos genéricos

  // Optional empresas CSV — silently ignored if missing
  try {
    const empRes = await fetch('data/empresas.csv');
    if (empRes.ok) {
      const text = await empRes.text();
      const parsed = Papa.parse(text, {header:true, skipEmptyLines:true});
      parsed.data.forEach(row => {
        if(row.numero_economico) empresaMap[row.numero_economico.trim()] = row.empresa.trim();
      });
    }
  } catch(e) { /* no empresas file yet */ }

  vehiclesData.forEach(v => v.empresa = empresaMap[v.label] || 'Sin asignar');

  initMap();
  drawRoutes();
  drawStops();
  drawMexibus();
  buildLineChips();
  buildSelects();
  drawVehicles();
  renderList();

  startLivePolling();
  refreshAfectaciones();
  setInterval(refreshAfectaciones, POLL_MS);
}

// ---- Polling de tiempo real ----
// Vuelve a pedir data/vehicles.json cada POLL_MS y redibuja los iconos.
// Si estás corriendo update_realtime.py en paralelo, ese archivo se va
// sobrescribiendo con posiciones frescas y aquí simplemente lo recargamos.
const POLL_MS = 25000;

function startLivePolling(){
  setInterval(refreshVehicles, POLL_MS);
}

async function refreshVehicles(){
  try {
    const res = await fetch('data/vehicles.json', {cache: 'no-store'});
    if (!res.ok) return;
    const fresh = await res.json();
    vehiclesData = fresh;
    vehiclesData.forEach(v => v.empresa = empresaMap[v.label] || 'Sin asignar');
    drawVehicles();
    renderList();
    document.getElementById('statusBar').textContent =
      'Última actualización: ' + new Date().toLocaleTimeString();
  } catch(e) {
    document.getElementById('statusBar').textContent = 'Error al actualizar: ' + e.message;
  }
}

// "Capa" aquí es solo un array de overlays (Polyline/Marker) de Google Maps -- a diferencia de
// Leaflet, la API de Google no tiene un LayerGroup nativo; mostrar/ocultar es poner/quitar cada
// overlay de su propio map con .setMap(map|null).
function capaVacia(arr){ arr.forEach(o => o.setMap(null)); arr.length = 0; }

function initMap(){
  map = new google.maps.Map(document.getElementById('map'), {
    center:{lat:19.4326, lng:-99.1332}, zoom:12, styles:DARK_MAP_STYLE,
    disableDefaultUI:false, fullscreenControl:false, streetViewControl:false, mapTypeControl:false,
  });
  routesLayer = []; stopsLayer = [];
  mexibusRoutesLayer = []; mexibusStopsLayer = [];
  mexicableRoutesLayer = []; mexicableStopsLayer = [];
  // Una sola InfoWindow compartida (reusarla cierra la anterior al abrir otra -- mismo
  // comportamiento que los popups de Leaflet, que se cerraban solos al abrir uno nuevo). No se
  // puede crear a nivel de módulo: `google.maps` no existe hasta que el script de Maps carga.
  vehicleInfoWindow = new google.maps.InfoWindow();
  map.addListener('zoom_changed', actualizarVisibilidadEstaciones);
}

// Solo las capas de ESTACIONES (pictogramas); las de rutas (routesLayer/mexibus.../mexicable...
// Routes) se quedan siempre visibles mientras su sistema esté activo, a cualquier zoom.
function actualizarVisibilidadEstaciones(){
  const lejos = map.getZoom() < ZOOM_PICTOGRAMAS_MIN;
  const capas = {
    metrobus: stopsLayer, mexibus: mexibusStopsLayer, mexicable: mexicableStopsLayer,
  };
  for (const sistema in capas) {
    const visible = sistemasActivos[sistema] && !lejos;
    capas[sistema].forEach(o => o.setMap(visible ? map : null));
  }
}

function toLatLngPath(pares){
  return pares.map(([lat,lon]) => ({lat, lng:lon}));
}

function drawRoutes(){
  capaVacia(routesLayer);
  const seen = new Set();
  routesData.forEach(r => {
    if (!r.shape || !r.shape.length) return;
    // avoid drawing duplicate overlapping shapes for same line pair
    const key = r.line + '_' + r.route_id;
    if (seen.has(key)) return;
    seen.add(key);
    const color = LINE_COLORS[r.line] || r.color || '#888';
    routesLayer.push(new google.maps.Polyline({
      path: toLatLngPath(r.shape), strokeColor:color, strokeWeight:3, strokeOpacity:0.55, map,
    }));
  });
}

// Pictograma real de GeoMB (icons/estaciones/, ver tools/sync_metrobus_estaciones.py) cuando hay
// datos sincronizados; si no, cae a los puntos blancos genéricos de siempre (data/stops.json,
// del GTFS oficial de Sonda -- sin pictograma, pero siempre disponibles).
function drawStops(){
  capaVacia(stopsLayer);
  if (metrobusLineas.length) {
    metrobusLineas.forEach(l => {
      (l.estaciones || []).forEach(e => {
        const icon = e.icono
          ? {url:`icons/estaciones/${e.icono}.png`, scaledSize:new google.maps.Size(20,20)}
          : {path:google.maps.SymbolPath.CIRCLE, scale:3, fillColor:'#ffffff', fillOpacity:0.8,
             strokeColor:'#ffffff', strokeWeight:1, strokeOpacity:0.6};
        stopsLayer.push(new google.maps.Marker({
          position:{lat:e.lat, lng:e.lon}, title:`${e.nombre} (Línea ${l.numero})`, icon,
        }));
      });
    });
  } else {
    stopsData.forEach(s => {
      stopsLayer.push(new google.maps.Marker({
        position:{lat:s.lat, lng:s.lon}, title:s.name,
        icon:{path:google.maps.SymbolPath.CIRCLE, scale:3, fillColor:'#ffffff', fillOpacity:0.8,
              strokeColor:'#ffffff', strokeWeight:1, strokeOpacity:0.6},
      }));
    });
  }
  actualizarVisibilidadEstaciones();   // recién creadas: arrancan sin .setMap(), según el zoom actual
}

// Mexibús (101-104 ordinario, 111-113 ramales) + Mexicable (201-202), ver data/mexibus_mapa.json.
// No hay posiciones en vivo para estos sistemas (ni en la app Android ni aquí: el feed de
// vehicles.json es exclusivo de la API oficial de Metrobús) -- solo trazo de ruta + estaciones.
function drawMexibus(){
  capaVacia(mexibusRoutesLayer); capaVacia(mexibusStopsLayer);
  capaVacia(mexicableRoutesLayer); capaVacia(mexicableStopsLayer);
  mexibusLineas.forEach(l => {
    const esMexicable = l.numero >= 200;
    const capaRutas = esMexicable ? mexicableRoutesLayer : mexibusRoutesLayer;
    const capaEst = esMexicable ? mexicableStopsLayer : mexibusStopsLayer;
    if (l.ruta && l.ruta.length > 1) {
      // Mexicable: línea punteada (icons repetidos, strokeOpacity:0 en el trazo base) para
      // distinguirla de Mexibús a simple vista -- igual que el dashArray que usaba Leaflet.
      const opciones = {path: toLatLngPath(l.ruta), strokeColor:l.color, strokeWeight:3, map};
      if (esMexicable) {
        opciones.strokeOpacity = 0;
        opciones.icons = [{icon:{path:'M 0,-1 0,1', strokeOpacity:1, scale:2}, offset:'0', repeat:'10px'}];
      } else {
        opciones.strokeOpacity = 0.75;
      }
      capaRutas.push(new google.maps.Polyline(opciones));
    }
    (l.estaciones || []).forEach(e => {
      // Pictograma real de GeoMB cuando existe (icons/estaciones/, ver tools/sync_iconos_geomb.py);
      // si no (p. ej. estación nueva aún no sincronizada), cae al círculo de color de siempre.
      const icon = e.icono
        ? {url:`icons/estaciones/${e.icono}.png`, scaledSize:new google.maps.Size(22,22)}
        : {path:google.maps.SymbolPath.CIRCLE, scale:4, fillColor:l.color, fillOpacity:0.9,
           strokeColor:l.color, strokeWeight:1.5};
      capaEst.push(new google.maps.Marker({
        position:{lat:e.lat, lng:e.lon}, title:`${e.nombre} (${l.nombre})`, icon,
      }));
    });
  });
  actualizarVisibilidadEstaciones();   // recién creadas: arrancan sin .setMap(), según el zoom actual
}

function toggleSistema(sistema){
  sistemasActivos[sistema] = !sistemasActivos[sistema];
  document.getElementById('chip' + sistema.charAt(0).toUpperCase() + sistema.slice(1))
    .classList.toggle('active', sistemasActivos[sistema]);
  // Las rutas (trazo de color) se ven siempre que el sistema esté activo, a cualquier zoom; las
  // estaciones (pictogramas) además respetan el umbral de zoom -- ver actualizarVisibilidadEstaciones().
  const rutasPorSistema = {
    metrobus: routesLayer, mexibus: mexibusRoutesLayer, mexicable: mexicableRoutesLayer,
  };
  rutasPorSistema[sistema].forEach(o => o.setMap(sistemasActivos[sistema] ? map : null));
  actualizarVisibilidadEstaciones();
  if (sistema === 'metrobus') { drawVehicles(); }   // los camiones van sobre el mapa, no en una capa propia
}

// ---- Afectaciones (Mexibús + Metrobús, fusionadas por el servidor en data/afectaciones_mexibus.json) ----
async function refreshAfectaciones(){
  try {
    const res = await fetch('data/afectaciones_mexibus.json', {cache:'no-store'});
    if (!res.ok) return;
    const doc = await res.json();
    renderAfectaciones(doc.afectaciones || []);
  } catch(e) { /* panel se deja como estaba; no bloquea el resto del mapa */ }
}

function renderAfectaciones(lista){
  const btn = document.getElementById('afectBtn');
  const panel = document.getElementById('afectPanel');
  btn.classList.toggle('alerta', lista.length > 0);
  btn.textContent = lista.length ? `⚠ Afectaciones (${lista.length})` : '✓ Sin afectaciones';
  if (!lista.length) {
    panel.innerHTML = '<h3>Afectaciones</h3><div class="empty">Sin afectaciones activas.</div>';
    return;
  }
  panel.innerHTML = '<h3>Afectaciones</h3>' + lista.map(a => `
    <div class="afect-card">
      <div class="afect-linea">Línea ${escapeHtml(a.linea)}</div>
      <div class="afect-estado">${escapeHtml(a.estado || '')}</div>
      ${a.lugar ? `<div>${escapeHtml(a.lugar)}</div>` : ''}
      ${a.info ? `<div class="afect-info">${escapeHtml(a.info)}</div>` : ''}
    </div>
  `).join('');
}

// Los textos de afectaciones vienen de un feed externo (Mexibús) o del panel admin -- no son
// estáticos de este archivo -- así que se escapan antes de insertarse en el DOM (XSS).
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toggleAfectPanel(){
  document.getElementById('afectPanel').classList.toggle('open');
}

function busIcon(color){
  return {
    path: google.maps.SymbolPath.CIRCLE, scale:8, fillColor:color, fillOpacity:1,
    strokeColor:'#ffffff', strokeWeight:2,
  };
}

function drawVehicles(){
  Object.values(vehicleMarkers).forEach(m => m.setMap(null));
  vehicleMarkers = {};
  filteredVehicles().forEach(v => {
    const color = LINE_COLORS[v.line] || '#bbb';
    const marker = new google.maps.Marker({
      position:{lat:v.lat, lng:v.lon}, map, icon: busIcon(color),
    });
    marker.addListener('click', () => {
      vehicleInfoWindow.setContent(`
        <div class="popup-eco">Eco. ${escapeHtml(v.label)}</div>
        <div class="popup-row">Línea ${escapeHtml(v.line || '—')} · Ruta ${escapeHtml(v.route_id)}</div>
        <div class="popup-row">${escapeHtml(v.origen || '—')} → ${escapeHtml(v.destino || '—')}</div>
        <div class="popup-row">Empresa: ${escapeHtml(v.empresa)}</div>
        <div class="popup-row">Placa: ${escapeHtml(v.plate || '—')}</div>
      `);
      vehicleInfoWindow.open(map, marker);
    });
    vehicleMarkers[v.id] = marker;
  });
}

function buildLineChips(){
  const container = document.getElementById('lineChips');
  const lines = [...new Set(routesData.map(r=>r.line))].sort();
  container.innerHTML = '';
  lines.forEach(line => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.innerHTML = `<img class="line-icon" src="icons/lineas/linea_${line}.png" alt="" onerror="this.remove()"> Línea ${line}`;
    chip.style.borderColor = LINE_COLORS[line];
    chip.onclick = () => {
      selectedLine = selectedLine === line ? null : line;
      document.querySelectorAll('#lineChips .chip').forEach(c=>c.classList.remove('active'));
      if (selectedLine) chip.classList.add('active');
      buildSelects();
      drawVehicles(); renderList();
    };
    container.appendChild(chip);
  });
}

function clearFilter(type){
  if(type==='line'){
    selectedLine = null;
    document.querySelectorAll('#lineChips .chip').forEach(c=>c.classList.remove('active'));
  }
  buildSelects();
  drawVehicles(); renderList();
}

function buildSelects(){
  const destinoSel = document.getElementById('destinoSelect');
  const routeSel = document.getElementById('routeSelect');
  const empresaSel = document.getElementById('empresaSelect');

  const relevantRoutes = routesData.filter(r => !selectedLine || r.line === selectedLine);
  const destinos = [...new Set(relevantRoutes.map(r=>r.destino).filter(Boolean))].sort();
  const prevDestino = destinoSel.value;
  destinoSel.innerHTML = '<option value="">Todos</option>' + destinos.map(d=>`<option value="${d}">${d}</option>`).join('');
  if (destinos.includes(prevDestino)) destinoSel.value = prevDestino;

  const prevRoute = routeSel.value;
  routeSel.innerHTML = '<option value="">Todas</option>' + relevantRoutes.map(r=>
    `<option value="${r.route_id}">L${r.line}: ${r.origen} → ${r.destino}</option>`).join('');
  if (relevantRoutes.some(r=>r.route_id===prevRoute)) routeSel.value = prevRoute;

  const empresas = [...new Set(Object.values(empresaMap))].sort();
  const prevEmp = empresaSel.value;
  empresaSel.innerHTML = '<option value="">Todas</option>' + empresas.map(e=>`<option value="${e}">${e}</option>`).join('') +
    (empresas.length ? '<option value="Sin asignar">Sin asignar</option>' : '');
  if ([...empresas,'Sin asignar'].includes(prevEmp)) empresaSel.value = prevEmp;
}

function filteredVehicles(){
  const destino = document.getElementById('destinoSelect').value;
  const routeId = document.getElementById('routeSelect').value;
  const empresa = document.getElementById('empresaSelect').value;
  const search = document.getElementById('searchBox').value.trim();

  return vehiclesData.filter(v => {
    if (selectedLine && v.line !== selectedLine) return false;
    if (destino && v.destino !== destino) return false;
    if (routeId && v.route_id !== routeId) return false;
    if (empresa && v.empresa !== empresa) return false;
    if (search && !v.label.includes(search)) return false;
    return true;
  });
}

function renderList(){
  const list = document.getElementById('vehicleList');
  const vehicles = filteredVehicles();
  document.getElementById('count').textContent = `${vehicles.length} unidades en servicio`;

  if (!vehicles.length){
    list.innerHTML = '<div class="empty">No hay unidades que coincidan con los filtros.</div>';
    return;
  }

  vehicles.sort((a,b)=> (a.line||'').localeCompare(b.line||'') || a.label.localeCompare(b.label));

  list.innerHTML = vehicles.map(v => `
    <div class="veh-item" onclick="focusVehicle('${v.id}')">
      <div class="veh-top">
        <span class="veh-eco">Eco. ${v.label}</span>
        <span class="veh-line" style="background:${LINE_COLORS[v.line]||'#666'}">
          ${v.line ? `<img class="line-icon" src="icons/lineas/linea_${v.line}.png" alt="" onerror="this.remove()">` : ''}L${v.line||'-'}
        </span>
      </div>
      <div class="veh-route">${v.origen||'—'} → ${v.destino||'—'}</div>
      <div class="veh-meta">
        <span>${v.empresa}</span>
        <span>Placa ${v.plate||'—'}</span>
      </div>
    </div>
  `).join('');
}

function focusVehicle(id){
  const marker = vehicleMarkers[id];
  if (!marker) return;
  map.panTo(marker.getPosition());
  map.setZoom(15);
  google.maps.event.trigger(marker, 'click');
}

document.getElementById('searchBox').addEventListener('input', ()=>{drawVehicles();renderList();});
document.getElementById('destinoSelect').addEventListener('change', ()=>{drawVehicles();renderList();});
document.getElementById('routeSelect').addEventListener('change', ()=>{drawVehicles();renderList();});
document.getElementById('empresaSelect').addEventListener('change', ()=>{drawVehicles();renderList();});
